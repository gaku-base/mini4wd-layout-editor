name: Apply part outline guide patch

on:
  push:
    branches:
      - feat/part-outline-guides

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/part-outline-guides
      - name: Apply focused source patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')

          needle = """  function drawPartSelectionEffect(c, type, stroke, fill, dashed = false, resolvedDef = PARTS[type]) {\n    c.save();\n    if (!tracePartShapePath(c, type)) { c.restore(); return; }\n"""
          insert = """  function drawPartOutlineGuide(c, part, stroke) {\n    if (!part || !PARTS[part.type]) return false;\n    const pose = resolvePartPose(part);\n    c.save();\n    c.translate(part.x, part.y);\n    c.rotate(pose.rotation * Math.PI / 180);\n    if (!tracePartShapePath(c, part.type)) { c.restore(); return false; }\n    c.strokeStyle = stroke;\n    c.lineWidth = 2 / Math.max(state.view.scale, .15);\n    c.setLineDash([6 / Math.max(state.view.scale, .15), 4 / Math.max(state.view.scale, .15)]);\n    c.stroke();\n    c.setLineDash([]);\n    c.restore();\n    return true;\n  }\n\n  function drawPartSelectionEffect(c, type, stroke, fill, dashed = false, resolvedDef = PARTS[type]) {\n    c.save();\n    if (!tracePartShapePath(c, type)) { c.restore(); return; }\n"""
          if needle not in text:
              raise SystemExit('drawPartSelectionEffect insertion point not found')
          text = text.replace(needle, insert, 1)

          old_start = """      const bounds = startBounds(candidate);\n      c.save();\n      c.strokeStyle = validity.valid ? '#249b74' : '#de3445';\n      c.lineWidth = 2 / state.view.scale;\n      c.setLineDash([6 / state.view.scale, 4 / state.view.scale]);\n      c.strokeRect(bounds.minX, bounds.minY, bounds.w, bounds.h);\n      c.setLineDash([]);\n      c.restore();\n"""
          new_start = """      drawPartOutlineGuide(\n        c,\n        { ...candidate, id: 'start', type: 'start' },\n        validity.valid ? '#249b74' : '#de3445'\n      );\n"""
          if old_start not in text:
              raise SystemExit('Start AABB guide block not found')
          text = text.replace(old_start, new_start, 1)

          old_ghost = """        drawPart(c, ghostPart);\n        c.restore();\n        drawConnectionGuide(c, proposal);\n"""
          new_ghost = """        drawPart(c, ghostPart);\n        c.restore();\n        drawPartOutlineGuide(\n          c,\n          ghostPart,\n          proposal.outOfBounds ? '#f07818' : (proposal.valid ? '#249b74' : '#de4b5b')\n        );\n        drawConnectionGuide(c, proposal);\n"""
          if old_ghost not in text:
              raise SystemExit('course ghost insertion point not found')
          text = text.replace(old_ghost, new_ghost, 1)

          path.write_text(text, encoding='utf-8')

          test = Path('part-outline-guides.test.js')
          test.write_text(r'''const test = require('node:test');
          const assert = require('node:assert/strict');
          const fs = require('node:fs');

          const source = fs.readFileSync('app.js', 'utf8');

          function functionBody(name, nextName) {
            const start = source.indexOf(`function ${name}`);
            assert.notEqual(start, -1, `${name} must exist`);
            const end = nextName ? source.indexOf(`function ${nextName}`, start + 1) : source.length;
            assert.notEqual(end, -1, `${nextName} must exist after ${name}`);
            return source.slice(start, end);
          }

          test('part outline guide uses the shared physical shape path after applying the part rotation', () => {
            const body = functionBody('drawPartOutlineGuide', 'drawPartSelectionEffect');
            assert.match(body, /resolvePartPose\(part\)/);
            assert.match(body, /c\.translate\(part\.x, part\.y\)/);
            assert.match(body, /c\.rotate\(pose\.rotation \* Math\.PI \/ 180\)/);
            assert.match(body, /tracePartShapePath\(c, part\.type\)/);
            assert.match(body, /setLineDash/);
            assert.doesNotMatch(body, /strokeRect|partBounds|startBounds|transformedBounds/);
          });

          test('Start placement guide no longer draws the rotated AABB rectangle', () => {
            const body = functionBody('drawCursorAndGhost', 'drawPointerCrosshair');
            const startSection = body.slice(body.indexOf("if (state.mode === 'start')"), body.indexOf("if (state.mode === 'place')"));
            assert.match(startSection, /drawPartOutlineGuide/);
            assert.match(startSection, /type: 'start'/);
            assert.doesNotMatch(startSection, /startBounds\(candidate\)|strokeRect\(bounds\.minX/);
          });

          test('course placement ghosts use the same part-shape outline at every rotation', () => {
            const body = functionBody('drawCursorAndGhost', 'drawPointerCrosshair');
            const placeSection = body.slice(body.indexOf("if (state.mode === 'place')"));
            assert.match(placeSection, /drawPartOutlineGuide\([\s\S]*ghostPart/);
            assert.match(placeSection, /proposal\.outOfBounds/);
            assert.match(placeSection, /proposal\.valid/);
          });

          test('selection outlines continue to use the shared physical part path rather than an AABB', () => {
            const body = functionBody('drawPartSelectionEffect', 'hoverStyleForMode');
            assert.match(body, /tracePartShapePath\(c, type\)/);
            assert.doesNotMatch(body, /strokeRect|partBounds|startBounds|transformedBounds/);
          });

          test('PNG export path does not call the transient dashed outline guide', () => {
            const exportStart = source.indexOf('function exportPNG');
            assert.notEqual(exportStart, -1, 'exportPNG must exist');
            const exportSlice = source.slice(exportStart, exportStart + 5000);
            assert.doesNotMatch(exportSlice, /drawPartOutlineGuide/);
          });
          ''', encoding='utf-8')
          PY
      - name: Verify focused tests
        run: |
          node --check app.js
          node --test part-outline-guides.test.js
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js part-outline-guides.test.js
          if git diff --cached --quiet; then
            echo "No patch changes to commit."
            exit 0
          fi
          git commit -m "feat: draw placement guides on part outlines"
          git push origin HEAD:feat/part-outline-guides
