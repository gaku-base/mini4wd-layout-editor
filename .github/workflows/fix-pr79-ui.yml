name: One-shot PR79 UI fix

on:
  push:
    branches:
      - feat/simplify-editor-ui

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/simplify-editor-ui
          fetch-depth: 0

      - name: Apply exact PR79 fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # P2: mirror the complete selected-id set into a read-only DOM dataset.
          replace_once(
              'app.js',
              "    els.statusSelected.textContent = String(state.selectedIds.length);\n",
              "    els.statusSelected.textContent = String(state.selectedIds.length);\n"
              "    if (els.courseCanvas) els.courseCanvas.dataset.selectedIds = JSON.stringify(state.selectedIds);\n"
          )

          # Add a canonical, order-independent selected-id signature helper.
          replace_once(
              'simple-ui.js',
              "  function normalizeContextIdentity(value) {\n"
              "    return String(value ?? '').replace(/\\s+/g, ' ').trim();\n"
              "  }\n\n",
              "  function normalizeContextIdentity(value) {\n"
              "    return String(value ?? '').replace(/\\s+/g, ' ').trim();\n"
              "  }\n\n"
              "  function canonicalSelectedIdSignature(value) {\n"
              "    let ids = value;\n"
              "    if (typeof ids === 'string') {\n"
              "      try { ids = JSON.parse(ids); } catch (_) { return ''; }\n"
              "    }\n"
              "    if (!Array.isArray(ids)) return '';\n"
              "    return [...new Set(ids.map(id => String(id ?? '').trim()).filter(Boolean))].sort().join('\\u001f');\n"
              "  }\n\n"
          )

          replace_once(
              'simple-ui.js',
              "      const selectionIdentity = normalizeContextIdentity(selectionInfo?.textContent || '');\n",
              "      const selectionIdentity = canonicalSelectedIdSignature(courseCanvas?.dataset?.selectedIds || '[]');\n"
          )

          replace_once(
              'simple-ui.js',
              "    if (selectionInfo) contextObserver.observe(selectionInfo, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });\n"
              "    if (obstaclePanel) contextObserver.observe(obstaclePanel, { attributes: true, attributeFilter: ['hidden'] });\n",
              "    if (selectionInfo) contextObserver.observe(selectionInfo, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });\n"
              "    if (courseCanvas) contextObserver.observe(courseCanvas, { attributes: true, attributeFilter: ['data-selected-ids'] });\n"
              "    if (obstaclePanel) contextObserver.observe(obstaclePanel, { attributes: true, attributeFilter: ['hidden'] });\n"
          )

          # P1: preserve the legacy single-column layout at <=720px.
          replace_once(
              'simple-ui.js',
              "      @media (max-width: 860px) {\n"
              "        body.simple-ui-enabled .workspace-shell { grid-template-columns: 190px minmax(0, 1fr) !important; }\n"
              "        body.simple-ui-enabled .right-sidebar { width: min(300px, calc(100vw - 24px)); }\n"
              "        body.simple-ui-enabled .statusbar { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n"
              "      }\n",
              "      @media (max-width: 860px) {\n"
              "        body.simple-ui-enabled .workspace-shell { grid-template-columns: 190px minmax(0, 1fr) !important; }\n"
              "        body.simple-ui-enabled .right-sidebar { width: min(300px, calc(100vw - 24px)); }\n"
              "        body.simple-ui-enabled .statusbar { grid-template-columns: repeat(2, minmax(0, 1fr)) !important; }\n"
              "      }\n"
              "      @media (max-width: 720px) {\n"
              "        body.simple-ui-enabled .workspace-shell { grid-template-columns: minmax(0, 1fr) !important; }\n"
              "      }\n"
          )

          replace_once(
              'simple-ui.js',
              "    normalizeContextIdentity,\n"
              "    buildContextSignature,\n",
              "    normalizeContextIdentity,\n"
              "    canonicalSelectedIdSignature,\n"
              "    buildContextSignature,\n"
          )

          # Regression tests for both new review findings.
          test_path = Path('simple-ui.test.js')
          test_text = test_path.read_text(encoding='utf-8')
          if "const APP_SOURCE = fs.readFileSync(require.resolve('./app.js'), 'utf8');" not in test_text:
              test_text = test_text.replace(
                  "const SOURCE = fs.readFileSync(require.resolve('./simple-ui.js'), 'utf8');\n",
                  "const SOURCE = fs.readFileSync(require.resolve('./simple-ui.js'), 'utf8');\n"
                  "const APP_SOURCE = fs.readFileSync(require.resolve('./app.js'), 'utf8');\n",
                  1
              )
          extra = r'''

test('selected-id signature is complete, order-independent, and fails closed', () => {
  assert.equal(UI.canonicalSelectedIdSignature('["part-b","part-a"]'), 'part-a\u001fpart-b');
  assert.equal(UI.canonicalSelectedIdSignature(['part-a', 'part-b']), 'part-a\u001fpart-b');
  assert.equal(UI.canonicalSelectedIdSignature(['part-b', 'part-a', 'part-a']), 'part-a\u001fpart-b');
  assert.notEqual(
    UI.canonicalSelectedIdSignature(['part-a', 'part-b']),
    UI.canonicalSelectedIdSignature(['part-a', 'part-c'])
  );
  assert.equal(UI.canonicalSelectedIdSignature('{broken'), '');
  assert.equal(UI.canonicalSelectedIdSignature(null), '');
});

test('app mirrors the complete selected-id array for simplified UI context identity', () => {
  assert.match(APP_SOURCE, /courseCanvas\.dataset\.selectedIds\s*=\s*JSON\.stringify\(state\.selectedIds\)/);
  assert.match(SOURCE, /canonicalSelectedIdSignature\(courseCanvas\?\.dataset\?\.selectedIds \|\| '\[\]'\)/);
  assert.match(SOURCE, /attributeFilter:\s*\['data-selected-ids'\]/);
});

test('simplified UI restores a single workspace column at 720px and below', () => {
  assert.match(
    SOURCE,
    /@media \(max-width: 720px\) \{[\s\S]*?body\.simple-ui-enabled \.workspace-shell \{ grid-template-columns:\s*minmax\(0, 1fr\) !important; \}/
  );
});
'''
          if "selected-id signature is complete, order-independent, and fails closed" not in test_text:
              test_text += extra
          test_path.write_text(test_text, encoding='utf-8')

          # This workflow is intentionally one-shot; remove it from the resulting fix commit.
          Path('.github/workflows/fix-pr79-ui.yml').unlink()
          PY

      - name: Run focused tests
        run: |
          node --check simple-ui.js
          node --check app.js
          node --test simple-ui.test.js

      - name: Commit and push fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app.js simple-ui.js simple-ui.test.js .github/workflows/fix-pr79-ui.yml
          git diff --cached --check
          git commit -m "fix: address responsive and selection identity review findings"
          git push origin HEAD:feat/simplify-editor-ui
