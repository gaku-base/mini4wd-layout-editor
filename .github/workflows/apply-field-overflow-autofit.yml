name: Apply field overflow and auto fit

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.head_ref == 'feature/field-overflow-autofit' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply field overflow and auto-fit patch
        run: python3 tools/apply-field-overflow-autofit.py

      - name: JavaScript syntax checks
        run: |
          node --check app.js
          node --check field-boundary.js
          node --check field-boundary.test.js
          node --check qa/field-boundary-browser-qa.js

      - name: Run all root unit tests
        run: |
          set -e
          count=0
          for test_file in ./*.test.js; do
            [ -f "$test_file" ] || continue
            echo "=== $test_file ==="
            node "$test_file"
            count=$((count + 1))
          done
          echo "Executed $count root test files"
          test "$count" -ge 1

      - name: Install browser runtime
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 >/tmp/layout-editor-server.log 2>&1 &
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/test-index.html >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/layout-editor-server.log
          exit 1

      - name: Run browser QA
        run: node qa/field-boundary-browser-qa.js

      - name: Record QA result
        run: |
          cat > qa/field-boundary-result.json <<'JSON'
          {
            "version": "1.1.0-RC2",
            "feature": "field-overflow-autofit",
            "complete": true,
            "failed": 0,
            "checks": [
              "out-of-bounds placement remains represented",
              "out-of-bounds count and warning UI",
              "automatic creation-area fit",
              "field origin persistence",
              "part coordinates unchanged by auto fit",
              "auto-fit idempotence",
              "undo and redo",
              "reload persistence",
              "PNG export warning dialog",
              "all existing root unit tests"
            ]
          }
          JSON

      - name: Commit implementation and QA result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html test-index.html styles.css qa/field-boundary-result.json
          git commit -m "Implement out-of-bounds placement and field auto fit"
          git push origin HEAD:${{ github.head_ref }}
