name: Temporary connected marker patch

on:
  push:
    branches:
      - fix/connected-yellow-marker-hit-proximity
    paths:
      - '.github/workflows/temp-adjust-connected-marker.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connected-yellow-marker-hit-proximity
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply prepared patch
        run: python3 tmp-patch-connected-marker.py
      - name: Run focused tests
        run: node --test connector-connected-target-nearby.test.js connector-target-lock-runtime.test.js
      - name: Commit patched files
        run: |
          rm .github/workflows/temp-adjust-connected-marker.yml tmp-patch-connected-marker.py
          git config user.name 'gaku-base'
          git config user.email 'mail.skgc@gmail.com'
          git add connector-target-lock-runtime.js connector-connected-target-nearby.test.js browser-connector-target-lock-smoke.js .github/ui-smoke.trigger .github/workflows/temp-adjust-connected-marker.yml tmp-patch-connected-marker.py
          git diff --cached --check
          git commit -m 'fix: 黄色接続点を選択時だけ表示'
          git push origin HEAD:fix/connected-yellow-marker-hit-proximity
