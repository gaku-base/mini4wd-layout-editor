name: PR checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.js' -print0)
          if [ ${#files[@]} -eq 0 ]; then
            echo 'JavaScript files were not found.'
            exit 0
          fi
          for file in "${files[@]}"; do
            node --check "$file"
          done

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            \( -name '*.test.js' -o -name '*.spec.js' \) -print0)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'Automated tests were not found.'
            exit 0
          fi
          node --test "${tests[@]}"

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f index.html
