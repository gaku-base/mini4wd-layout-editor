name: PR checks

on:
  pull_request:
    paths-ignore:
      - 'alignment_test.png'
      - 'corner45_8piece_closure_test.png'
      - 'preview.png'
      - 'qa/**/*.png'
      - 'artifacts/**'
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_rehearsal:
        description: 'Run the full Chromium regression after local checks'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required project files
        shell: bash
        run: |
          set -euo pipefail
          test -f AGENTS.md
          test -f index.html
          test -f package.json
          test -f package-lock.json
          test -f tsconfig.json
          test -f tsconfig.build.json
          test -f src/domain/toolchain-probe.ts
          test -f marquee-target-preview.js
          test -f start-replacement-snap.js
          test -f presentation-data.js
          test -f presentation-renderer.js
          test -f presentation-export.js
          test -f presentation-mode.js
          test -f browser-presentation-rehearsal.js
          test -f ui-controls-cleanup.js
          test -f browser-ui-controls-smoke.js
          test -f browser-slope-visibility-smoke.js
          test -f browser-slope-underpass-smoke.js
          test -f browser-bank20-projection-smoke.js
          test -f browser-connector-target-lock-smoke.js
          test -f browser-start-boundary-snap-smoke.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install typed-domain tooling
        shell: bash
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck, lint and build typed domain path
        shell: bash
        run: npm run check:typed

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            -name '*.js' -print0 \
            | xargs -0 -r -n 1 -P "$(nproc)" node --check

      - name: Run automated tests
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' tests < <(find . \
            -path './.git' -prune -o \
            -path './node_modules' -prune -o \
            \( -name '*.test.js' -o -name '*.spec.js' \) -print0)
          if [ ${#tests[@]} -eq 0 ]; then
            echo 'Automated tests were not found.'
            exit 0
          fi
          node --test --test-reporter=spec "${tests[@]}"

      - name: Run Chromium rehearsal
        if: (github.event_name == 'workflow_dispatch' && inputs.full_rehearsal) || hashFiles('.github/full-rehearsal.trigger') != '' || hashFiles('.github/ui-smoke.trigger') != ''
        shell: bash
        env:
          FULL_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_rehearsal }}
        run: |
          set -euo pipefail

          browser_mode="ui"
          if [ "$FULL_REHEARSAL" = "true" ] || [ -f .github/full-rehearsal.trigger ]; then
            browser_mode="full"
          fi
          echo "Chromium mode: ${browser_mode}"

          smoke_root="${RUNNER_TEMP}/m4wd-browser-smoke"
          mkdir -p "$smoke_root"
          npm install \
            --prefix "$smoke_root" \
            --no-save \
            --no-package-lock \
            --no-audit \
            --no-fund \
            --ignore-scripts \
            playwright-core@1.55.0

          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_bin" ]; then
            echo 'Chrome/Chromium executable was not found on the GitHub runner.' >&2
            exit 1
          fi

          python3 -m http.server 4173 --bind 127.0.0.1 >"${RUNNER_TEMP}/m4wd-http.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error http://127.0.0.1:4173/index.html >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              cat "${RUNNER_TEMP}/m4wd-http.log" >&2 || true
              exit 1
            fi
            sleep 0.25
          done

          export NODE_PATH="$smoke_root/node_modules"
          export CHROME_BIN="$chrome_bin"
          export BROWSER_SMOKE_BASE_URL="http://127.0.0.1:4173/index.html"
          export BROWSER_SMOKE_ARTIFACT_DIR="artifacts/browser-smoke"

          if [ "$browser_mode" = "full" ]; then
            node browser-smoke.js
            node browser-trash-smoke.js
            node browser-mode-help-smoke.js
            node browser-marquee-preview-smoke.js
            node browser-start-resnap-smoke.js
            node browser-presentation-rehearsal.js
          fi
          node browser-ui-controls-smoke.js
          node browser-slope-visibility-smoke.js
          node browser-slope-underpass-smoke.js
          node browser-bank20-projection-smoke.js
          node browser-connector-target-lock-smoke.js
          node browser-start-boundary-snap-smoke.js

      - name: Upload browser rehearsal failure screenshot
        if: failure() && ((github.event_name == 'workflow_dispatch' && inputs.full_rehearsal) || hashFiles('.github/full-rehearsal.trigger') != '' || hashFiles('.github/ui-smoke.trigger') != '')
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-failure
          path: artifacts/browser-smoke/
          if-no-files-found: ignore
          retention-days: 7
